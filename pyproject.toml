[project]
name = "podarena"
version = "0.1.0"
description = "Track records an allocator can verify without trusting us"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.17",
    "dkimpy>=1.1.8",
    "dnspython>=2.7",
    "web3>=7.6",
    "boto3>=1.35",
    "cryptography>=50.0.0",
]

[project.scripts]
podarena-verify = "verifier.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "api", "worker", "verifier", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
